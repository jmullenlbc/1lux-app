<title>CLIQ Layout Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: SHIFT/CLIQ look from the CLIQ AI Quote Tool — black rail with cyan, working canvas beside it.
   Layout view = area form | plan drawing + numbers. Plan view = sheet canvas with drawn rows. */
:root{
  --bg:#f2f6f8; --surface:#ffffff; --surface-2:#eaf1f5; --line:#d9e3e9; --line-2:#c3d1d9;
  --fg:#0d1418; --muted:#55636b; --faint:#86939b;
  --accent:#006699; --accent-fill:#4ED9F9; --accent-soft:#dff5fd; --on-accent:#0A0A0A; --accent-2:#1FA6DD;
  --good:#18794a; --good-soft:#e2f3ea; --warn:#9a6206; --warn-soft:#fbf0da; --bad:#c2253c; --bad-soft:#fce6ea;
  --rail:#0A0A0A; --rail-fg:#eaf6fa; --rail-muted:#8b9aa2; --rail-line:#1f272c; --rail-hover:#151c20; --rail-active:#4ED9F9; --rail-active-bg:rgba(78,217,249,.12);
  --plan-bg:#f7fafb; --plan-wall:#0d1418; --plan-row:#1FA6DD; --plan-fx:#0A0A0A; --plan-em:#c2253c; --plan-grid:#e3ebf0;
  --shadow:0 1px 2px rgba(5,20,30,.06),0 8px 24px rgba(5,20,30,.07);
  --font:"Roboto",Arial,system-ui,sans-serif; --mono:"Roboto Mono",ui-monospace,Menlo,Consolas,monospace; --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#090d10; --surface:#11171b; --surface-2:#182026; --line:#232e35; --line-2:#314049;
  --fg:#e6eff3; --muted:#9babb4; --faint:#6c7d86;
  --accent:#4ED9F9; --accent-fill:#4ED9F9; --accent-soft:#0e2c36; --on-accent:#0A0A0A; --accent-2:#1FA6DD;
  --good:#53c98a; --good-soft:#0f2c1e; --warn:#e3ad4d; --warn-soft:#33270f; --bad:#ff6b80; --bad-soft:#3a141c;
  --plan-bg:#0e1418; --plan-wall:#cfdde4; --plan-row:#4ED9F9; --plan-fx:#e6eff3; --plan-em:#ff6b80; --plan-grid:#1a2329;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 8px 24px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#090d10; --surface:#11171b; --surface-2:#182026; --line:#232e35; --line-2:#314049;
  --fg:#e6eff3; --muted:#9babb4; --faint:#6c7d86;
  --accent:#4ED9F9; --accent-fill:#4ED9F9; --accent-soft:#0e2c36; --on-accent:#0A0A0A; --accent-2:#1FA6DD;
  --good:#53c98a; --good-soft:#0f2c1e; --warn:#e3ad4d; --warn-soft:#33270f; --bad:#ff6b80; --bad-soft:#3a141c;
  --plan-bg:#0e1418; --plan-wall:#cfdde4; --plan-row:#4ED9F9; --plan-fx:#e6eff3; --plan-em:#ff6b80; --plan-grid:#1a2329;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 8px 24px rgba(0,0,0,.4); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:13.5px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
.mono,.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.num{text-align:right;white-space:nowrap}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-size:21px;font-weight:700} h2{font-size:16px;font-weight:700} h3{font-size:13.5px;font-weight:700}
.label{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:12px}
:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px}

.app{display:grid;grid-template-columns:210px minmax(0,1fr);min-height:100%}
.rail{background:var(--rail);color:var(--rail-fg);padding-block:20px;padding-inline:14px;display:flex;flex-direction:column;gap:20px;position:sticky;top:0;height:100vh}
.brand{display:flex;flex-direction:column;gap:2px;padding:2px 8px}
.brand .word{font-family:var(--mono);font-weight:600;font-size:20px;letter-spacing:.18em;color:var(--rail-active)}
.brand .sub{font-size:10.5px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--rail-muted)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:5px;color:var(--rail-fg);text-decoration:none;font-weight:500;font-size:13px}
.nav a:hover{background:var(--rail-hover)}
.nav a[aria-current="page"]{background:var(--rail-active-bg);color:var(--rail-active)}
.nav svg{width:16px;height:16px;flex:none}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--rail-muted)}
.conn{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:5px;background:var(--rail-hover);color:var(--rail-fg)}
.dot{width:8px;height:8px;border-radius:50%;background:#86939b;flex:none}
.dot.ok{background:#3fd38a} .dot.warn{background:#f0b54d} .dot.bad{background:#ff5f75}
main{min-width:0;padding-block:22px 64px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.page{max-width:1320px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.page-head p{margin:4px 0 0;color:var(--muted);max-width:72ch}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line-2);background:var(--surface);border-radius:5px;padding:7px 12px;font-weight:500;font-size:12.5px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent-fill);border-color:var(--accent-fill);color:var(--on-accent);font-weight:700}
.btn.primary:hover{filter:brightness(.95)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 8px;font-size:11.5px}
.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent-2);color:var(--accent)}
.btn:disabled{opacity:.5;cursor:not-allowed}
input[type=text],input[type=number],input[type=search],select,textarea{background:var(--surface);border:1px solid var(--line-2);border-radius:5px;padding:6px 8px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent-2);box-shadow:0 0 0 3px var(--accent-soft)}
input[type=checkbox]{accent-color:var(--accent-2)}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>span{font-size:11px;font-weight:500;color:var(--muted)}
.check{display:flex;align-items:center;gap:8px;font-size:12.5px}
.grid{display:grid;gap:10px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.panel.flush{padding:0}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:500;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip.good{background:var(--good-soft);color:var(--good)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.accent{background:var(--accent-soft);color:var(--accent)}
.banner{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-radius:var(--r);background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent)}
.banner.info{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent-2) 30%,transparent)}
.banner.bad{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 30%,transparent)}
.scroll-x{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:none}
tfoot td{font-weight:700;border-top:1px solid var(--line-2)}
.sku{font-family:var(--mono);font-weight:600;font-size:12.5px;white-space:nowrap}
.desc{color:var(--muted);font-size:12px}
.list{margin:0;padding-left:18px;display:grid;gap:4px;font-size:12.5px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.stat{background:var(--surface-2);border-radius:var(--r);padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .v{font-family:var(--mono);font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.toast{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:6px;font-weight:500;font-size:12.5px;box-shadow:var(--shadow);z-index:50;max-width:min(420px,calc(100vw - 36px))}

/* layout view */
.lay{display:grid;grid-template-columns:minmax(320px,410px) minmax(0,1fr);gap:16px;align-items:start}
.areas{display:flex;gap:6px;flex-wrap:wrap}
.area-tab{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:12.5px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.area-tab[aria-current="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.area-tab .n{font-family:var(--mono);font-size:11px;opacity:.75}
fieldset{border:0;margin:0;padding:0;display:grid;gap:10px}
legend{padding:0;margin-bottom:6px}
.formcol{display:flex;flex-direction:column;gap:16px}
.planbox{background:var(--plan-bg);border:1px solid var(--line);border-radius:var(--r);overflow:auto;min-height:280px}
.planbox svg{display:block;width:100%;height:auto}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:4px;border-radius:2px;vertical-align:middle;margin-right:5px}

/* plan view */
.sheet-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sheet{position:relative;background:var(--plan-bg);border:1px solid var(--line);border-radius:var(--r);overflow:auto;max-height:72vh;min-height:320px}
.sheet canvas{display:block}
.sheet svg{position:absolute;left:0;top:0}
.sheet.drawing{cursor:crosshair}
.dropzone{border:1.5px dashed var(--line-2);border-radius:var(--r);padding:28px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:8px;align-items:center;background:var(--surface)}
.dropzone.over{border-color:var(--accent-2);background:var(--accent-soft)}
.plan-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line-2);border-radius:3px;padding:0 4px}

/* tests */
.pass{color:var(--good);font-weight:700} .fail{color:var(--bad);font-weight:700}
.diff td{font-family:var(--mono);font-size:12px}

@media (max-width: 1100px){.lay,.plan-grid{grid-template-columns:minmax(0,1fr)}}
@media (max-width: 760px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;gap:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px}
  .nav{flex-direction:row;flex-wrap:wrap}
  .rail-foot{margin-top:0;width:100%}
  main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app">
  <aside class="rail">
    <div class="brand"><span class="word">CLIQ</span><span class="sub">Layout Lab · SHIFT</span></div>
    <nav class="nav" aria-label="Views">
      <a href="#layout" data-view="layout"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1.5" y="2.5" width="13" height="11" rx="1"/><path d="M4 6h8M4 8h8M4 10h8"/></svg>Layout</a>
      <a href="#plan" data-view="plan"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 2.5h12v11H2z"/><path d="M4 11l3-4 2 2 3-4"/></svg>Plan</a>
      <a href="#parts" data-view="parts"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 3.5h10M3 8h10M3 12.5h10"/></svg>Parts and price</a>
      <a href="#tests" data-view="tests"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 8.5l3 3 7-7"/></svg>Test cases</a>
      <a href="#setup" data-view="setup"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="2.5"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"/></svg>Setup</a>
    </nav>
    <div class="rail-foot">
      <div class="conn" id="conn"><span class="dot" id="conn-dot"></span><span id="conn-text">Connecting…</span></div>
      <div id="store-text" class="small"></div>
      <div class="small">Read-only. Nothing is written to NetSuite.</div>
    </div>
  </aside>
  <main><div class="page" id="view"></div></main>
</div>
<div class="toast" id="toast" hidden></div>
