version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
        # ── Safety: block deploy if any (app) page is missing force-dynamic ─
        - node scripts/check-dynamic-pages.js
        # ── Safety: block deploy if any migration uses SQLite-only SQL ─────
        # (DATETIME / BOOLEAN DEFAULT 0/1 / AUTOINCREMENT — would crash
        # `prisma migrate deploy` against PostgreSQL further down)
        - node scripts/check-migrations-postgres.js
        # ── Generate deploy history log (git log → deploy-log.json) ─────────
        - node scripts/generate-deploy-log.js
        # ── Schema provider patch ────────────────────────────────────────────
        # schema.prisma uses sqlite locally (no Docker required for dev).
        # Production DATABASE_URL is PostgreSQL, so we patch the provider here
        # before generating the client. This is ephemeral — only affects the
        # Amplify build container, never touches the source in the repo.
        - sed -i 's/provider = "sqlite"/provider = "postgresql"/' prisma/schema.prisma
        - echo "Schema provider after patch:" && grep 'provider' prisma/schema.prisma
        # ── Generate client + migrate schema ─────────────────────────────────
        - npx prisma generate
        # Baseline: mark 0001_baseline as already applied on first-ever migrate
        # run (tables were created by db push — no need to re-run the DDL).
        # Silently ignored on every subsequent deploy when it's already recorded.
        - npx prisma migrate resolve --applied "0001_baseline" 2>/dev/null || true
        # Recovery: 0023_proposals failed mid-apply on 2026-06-09 (forward
        # foreign-key reference to ProposalTemplate, fixed in commit 9c968a2 by
        # reordering). Mark the failed attempt as rolled back so migrate deploy
        # will try the corrected migration. Silently no-ops once 0023 is
        # successfully applied (Prisma rejects resolve on a clean migration).
        - npx prisma migrate resolve --rolled-back "0023_proposals" 2>/dev/null || true
        # Apply any new migrations committed since the last deploy.
        # Safe: never drops data, never touches already-applied migrations.
        - npx prisma migrate deploy
        # ── Seed admin accounts (upsert — safe to run every deploy) ─────────
        - node prisma/seed.js
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
